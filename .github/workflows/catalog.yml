name: Katalog propozycji i publikacja Cloudflare

on:
  schedule:
    - cron: '31 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'scripts/catalog.py'
      - 'web/**'
      - 'tests/test_catalog.py'
      - 'sources.toml'
      - '.github/workflows/catalog.yml'

permissions:
  contents: write

concurrency:
  group: catalog-pages-main
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Uruchom testy ekstrakcji
        run: python -m unittest discover -s tests -p 'test_catalog.py' -v
      - name: Pobierz aktualny awesome-legaltech i metryki GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/catalog.py
      - name: Zapisz snapshot katalogu, bez dotykania źródeł
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp catalog/proposals.json "$RUNNER_TEMP/proposals.json"
          # Checkout jest izolowany w runnerze. Wersja źródłowa _vendor i
          # _workbench pozostaje nietknięta; zapisujemy tylko JSON katalogu.
          saved=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p catalog
            cp "$RUNNER_TEMP/proposals.json" catalog/proposals.json
            git add -- catalog/proposals.json
            if git diff --cached --quiet; then
              echo 'Katalog bez zmian.'
              saved=true
              break
            fi
            git commit -m 'data: refresh awesome-legaltech catalog'
            if git push origin HEAD:main; then
              saved=true
              break
            fi
            echo "::warning::Równoległy commit, ponawiam zapis JSON (próba $attempt/3)"
          done
          if [ "$saved" != true ]; then
            echo 'Nie udało się bezpiecznie zapisać katalogu po 3 próbach.' >&2
            exit 1
          fi
      - name: Zbuduj statyczną stronę
        run: |
          mkdir -p site/data
          cp web/index.html web/styles.css web/app.js site/
          cp catalog/proposals.json site/data/proposals.json
          touch site/.nojekyll
          echo "Wpisów: $(python -c 'import json;print(json.load(open("catalog/proposals.json"))["count"])')" >> "$GITHUB_STEP_SUMMARY"
      - name: Zachowaj wersję statyczną do audytu
        uses: actions/upload-artifact@v4
        with:
          name: legaltech-site
          path: site
          retention-days: 14
      - name: Sprawdź publiczne wdrożenie dan.xlap.pl
        run: |
          mkdir -p /tmp/druzyna-public
          for asset in index.html app.js styles.css data/proposals.json; do
            curl --fail --silent --show-error --retry 4 --retry-delay 3 \
              "https://dan.xlap.pl/$asset" \
              --output "/tmp/druzyna-public/$(basename "$asset")"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          public = Path('/tmp/druzyna-public')
          doc = json.loads((public / 'proposals.json').read_text(encoding='utf-8'))
          assert doc['schema'] == 1 and doc['count'] > 0
          assert len(doc['proposals']) == doc['count']
          assert 'Drużyna Andrzeja' in (public / 'index.html').read_text(encoding='utf-8')
          assert 'function card(' in (public / 'app.js').read_text(encoding='utf-8')
          assert '.item' in (public / 'styles.css').read_text(encoding='utf-8')
          print(f"Public website OK: {doc['count']} proposals")
          PY
          echo "Cloudflare Worker: https://dan.xlap.pl — HTTPS 200, HTML/CSS/JS i dane katalogu poprawne." >> "$GITHUB_STEP_SUMMARY"
