name: Publiczne żądanie pobrania repozytorium

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: public-fetch-request-main
  cancel-in-progress: false

jobs:
  fetch-request:
    if: startsWith(github.event.issue.title, 'fetch: ')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testy walidatora żądań
        run: python -m unittest discover -s tests -p 'test_accept_request.py' -v
      - name: Pobierz zweryfikowane zgłoszenie i repozytorium
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          slug="$(python - <<'PY'
          import os,re
          title=os.environ.get('ISSUE_TITLE','')
          m=re.fullmatch(r'fetch: ([A-Za-z0-9_.-]{1,100})/([A-Za-z0-9_.-]{1,100})', title, re.I)
          print(m.group(1)+'/'+m.group(2) if m else '')
          PY
          )"
          if [ -z "$slug" ]; then
            echo 'Niepoprawny tytuł żądania.' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          gh api "repos/$slug" > "$RUNNER_TEMP/upstream.json" || echo '{}' > "$RUNNER_TEMP/upstream.json"
      - name: Dopisz źródło do sources.toml z kontrolą kolizji
        id: accept
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          done=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/accept_request.py \
              --issue-json "$RUNNER_TEMP/issue.json" \
              --repo-json "$RUNNER_TEMP/upstream.json" \
              --outcome "$RUNNER_TEMP/accept.json"
            status="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/accept.json")"
            if [ "$status" != added ]; then
              done=true
              break
            fi
            git add -- sources.toml
            git commit -m "source: accept public request #$GITHUB_RUN_ID"
            if git push origin HEAD:main; then
              done=true
              break
            fi
            echo "::warning::main zmieniono podczas zapisu; ponawiam próbę $attempt."
          done
          if [ "$done" != true ]; then
            echo 'Nie udało się bezpiecznie zapisać źródła.' >&2
            exit 1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Uruchom synchronizację źródeł
        if: steps.accept.outputs.status == 'added'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/sync.yml/dispatches" -f ref=main
      - name: Zapisz wynik na GitHub Issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/accept.json" ]; then
            python - "$RUNNER_TEMP/accept.json" > "$RUNNER_TEMP/comment.txt" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          print("**Automatyczne pobieranie:** " + data["status"] + "\n\n" + data["message"])
          if data['status'] == 'added':
              print("\nZlecono synchronizację. Wynik klonowania i raport _sync są w Actions.")
          PY
          else
            echo "Obsługa żądania zakończyła się błędem. Zobacz log workflow." > "$RUNNER_TEMP/comment.txt"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" -F "$RUNNER_TEMP/comment.txt"
